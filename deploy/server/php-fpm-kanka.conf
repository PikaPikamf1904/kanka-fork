; PHP-FPM pool for Kanka, sized for a 1 GB e2-micro shared with MariaDB.
; Workers start on demand and exit when idle, so memory is only used while
; someone is browsing.
[kanka]
user = kanka
group = kanka
listen = /run/php/php8.4-fpm-kanka.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 300

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 32M
; Request bodies up to 100M for signed campaign-import uploads (read into memory).
php_admin_value[post_max_size] = 100M
php_admin_value[expose_php] = Off
php_admin_flag[log_errors] = on

; OPcache: compile once, never re-check files (each release is a new directory).
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 96
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0
