; PHP-FPM pool for Kanka on Big Bertha (4 GB RAM, dual-core CPU).
; Workers start on demand and exit when idle, so memory is only used while someone
; is browsing. Six children are plenty for a gaming group on two CPU cores.
[kanka]
user = kanka
group = kanka
listen = /run/php/php8.4-fpm-kanka.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 60s
pm.max_requests = 500
request_terminate_timeout = 190s

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 32M
; Request bodies up to 100M for signed campaign-import uploads (read into memory).
php_admin_value[post_max_size] = 100M
php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
