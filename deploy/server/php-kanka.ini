; PHP-FPM settings for Kanka that must be set for the whole FPM service, not per pool.
; Installed to /etc/php/8.4/fpm/conf.d/90-kanka.ini.
; OPcache compiles once and never re-checks files: every release is a new directory and
; release.sh reloads PHP-FPM after switching.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
