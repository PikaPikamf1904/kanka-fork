# nginx site for Kanka. Listens on localhost only: the public HTTPS endpoint is
# Tailscale Funnel, which terminates TLS and proxies to http://127.0.0.1:80.
server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    root /srv/kanka/current/public;
    index index.php;
    charset utf-8;

    # Matches post_max_size in php-fpm-kanka.conf (single files are capped at 32M).
    client_max_body_size 100m;
    server_tokens off;

    # The free tier includes only 1 GB/month of egress: compress all text responses.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed Vite assets never change: let browsers keep them for a year to save egress.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # User uploads: files only, never execute anything from here.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        location ~ \.php$ { return 404; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-kanka.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Every public request arrives over Funnel's HTTPS.
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
