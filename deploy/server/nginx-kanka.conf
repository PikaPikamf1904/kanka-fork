# nginx site for Kanka on Big Bertha (home LAN). Installed to /etc/nginx/sites-available/kanka.
#
# Plain HTTP on IPv4 port 80, answering only home-network and loopback addresses. This
# is an nginx allowlist, not a firewall rule: nothing here opens router ports, and if
# the machine were ever reachable from the internet nginx would still answer 403.
# For HTTPS from your own devices, see "Remote access" in deploy/README.md.
server {
    listen 80 default_server;
    server_name _;

    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    # Tailscale addresses, only used if you install Tailscale yourself.
    allow 100.64.0.0/10;
    deny all;

    root /srv/kanka/current/public;
    index index.php;
    charset utf-8;

    # Matches post_max_size in php-fpm-kanka.conf (single files are capped at 32M).
    client_max_body_size 100m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed Vite assets never change.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploads must pass through the application so campaign and entity permissions apply.
    # Site assets such as /build, /images and /fonts remain static public files.
    location /storage/ {
        autoindex off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-kanka.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        # An old dual-core CPU can take a while on big pages; exports run in the queue.
        fastcgi_read_timeout 180;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
