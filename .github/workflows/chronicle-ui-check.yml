name: Chronicle UI checks
on:
  push:
    branches:
      - codex/chronicle-character-wiki-20261110
  pull_request:
    paths:
      - "chronicle-cloud/**"
      - ".github/workflows/chronicle-ui-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chronicle-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chronicle-cloud/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: pk_test_ci_no_live_access
  # Database security, privacy and concurrency tests against a disposable local stack (real
  # PostgreSQL, Auth, Data API and Storage on 127.0.0.1). Never contacts a hosted project: the
  # test harness refuses any database that is not the local one it created.
  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chronicle-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chronicle-cloud/package-lock.json
      - run: npm ci
      - name: PostgreSQL 16 binaries
        run: test -x /usr/lib/postgresql/16/bin/initdb || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-16)
      - name: Start the disposable local stack
        run: |
          # The postgres user must be able to reach the data folder under the checkout.
          d="$PWD"; while [ "$d" != "/" ]; do sudo chmod o+x "$d"; d="$(dirname "$d")"; done
          sudo env "PATH=$PATH" bash scripts/local-stack.sh up
      - name: Stack safety checks
        run: |
          sudo env "PATH=$PATH" bash scripts/local-stack-safety.test.sh
          node --test scripts/local-targets.test.mjs
      - name: Database tests
        run: sudo env "PATH=$PATH" npm run test:db
      - name: Server log on failure
        if: failure()
        run: sudo tail -n 80 .local/pg/server.log || true
