[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-command-center"
version = "0.1.0"
description = "Local-first dashboard for Claude Code and Grok Build usage"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "opentelemetry-proto>=1.27",
  "protobuf>=5",
  "httpx>=0.27",
  "tzdata>=2024.1",  # Windows has no system IANA database; zoneinfo needs it for America/Phoenix
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
acc = "acc.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
acc = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLR1730"]
# Pydantic generic models keep Generic[T] for compatibility.
ignore = ["UP046"]

[tool.ruff.lint.isort]
known-first-party = ["acc"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
# All backend code is strict; WP owners keep their packages passing.
files = ["backend/acc"]
